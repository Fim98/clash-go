name: Release

# `git tag v0.1.0 && git push origin v0.1.0` builds every platform, uploads
# the builds to a draft release, and publishes it. The tag has to match
# `version` in mygo.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release and the uploads to it

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against mygo.json
        run: |
          version=$(jq -r .version mygo.json)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in mygo.json"
            exit 1
          }
      # The draft exists before the builds start, so that they all upload
      # to it instead of creating drafts of their own.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  build:
    name: Build ${{ matrix.name }}
    needs: draft-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The Windows installers are NSIS packages, made on any system that
      # has NSIS.
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: mygo build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(
            build/*/*.dmg
            build/*/*-setup-*.exe
            build/*/*.deb
            build/*/*.tar.gz
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::the build wrote no artifacts"
            exit 1
          fi
          printf 'Uploading:\n'
          printf '  %s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease ;;
            *) gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false ;;
          esac